[package]
name = "troves_clvaults"
version = "2.0.0"
edition = "2023_11"
cairo-version = "2.18.0"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
openzeppelin = "3.0.0"
ekubo = { git = "https://github.com/EkuboProtocol/abis.git", rev = "f4a16b95967c5596d5a3cd4e0422bb9a2e3eb017"}
starknet = "2.18.0" # cairo version
# StarkWare roles / pausable / replaceability / math (as used by starknet-staking), pinned by commit
starkware_utils = { git = "https://github.com/starkware-libs/starkware-starknet-utils", rev = "3e2fd53d99e16c87f6cf2ced53b8c842a2d54a18" }

[dev-dependencies]
snforge_std = "0.63.0"
assert_macros = "2.18.0"

[[target.starknet-contract]]
casm = true

[lib]

[scripts]
test = "snforge test --max-n-steps 30000000"
buildr = "scarb --profile release build"
coverage = "snforge test --save-trace-data --rerun-failed && snforge test --coverage --rerun-failed && genhtml -o coverage_report coverage/coverage.lcov"

[[test]]
name = "contracts_test"

[[tool.snforge.fork]]
name = "mainnet_4707139"
url = "$MAINNET_RPC_URL_V10"
block_id.number = "4707139"


[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"
[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
